name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: checkboxes
    id: notify-only
    attributes:
      label: 确认
      options:
        - label: 这个建议不需要扩展在飞书里发送或修改内容（本项目只通知不操作）
          required: true
