<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Feishu Notify</title>
<style>body{font:13px system-ui,sans-serif;width:340px;margin:10px}h2{font-size:14px;margin:8px 0 4px}
button{margin:2px 2px 2px 0}ul{padding-left:16px;margin:4px 0;max-height:260px;overflow:auto}li{margin:2px 0}.muted{color:#666}</style>
</head><body>
<div><b id="mode"></b></div>
<div class="muted">Queue: <span id="queue"></span> · dropped: <span id="dropped"></span></div>
<div class="muted">Last push: <span id="last"></span></div>
<p>
<button data-snooze="60">Pause 1 h</button><button data-snooze="morning">Pause until tomorrow</button><button id="resume">Resume</button><button id="flush">Push queue now</button>
</p>
<h2>Recent events</h2><ul id="log"></ul>
<p><a href="options.html" target="_blank">Settings</a></p>
<script type="module" src="popup.js"></script>
</body></html>
