<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Feishu Notify – Settings</title>
<style>
body{font:14px system-ui,sans-serif;max-width:760px;margin:16px auto;padding:0 12px}
fieldset{margin:12px 0;border:1px solid #ddd;border-radius:6px}legend{font-weight:600}
label{display:block;margin:6px 0}input[type=text],input[type=url],input[type=password],textarea,select{width:100%;box-sizing:border-box}
textarea{height:56px}.row{display:flex;gap:8px;align-items:center}.row input{width:auto}
.err{color:#d93025}#status{margin-left:8px}table{border-collapse:collapse}td{padding:2px 6px}
</style></head><body>
<h1>Feishu Notify – Settings</h1>
<fieldset><legend>Connection</legend>
<label>Grok Bot receiver URL <input id="endpointUrl" type="url" placeholder="https://…"></label>
<label>Key (sent as <code>Authorization: Bearer …</code>) <input id="apiKey" type="password" autocomplete="off" placeholder="leave empty to keep the saved key"></label>
<div id="keyHint"></div>
<label>Instance name <input id="instanceName" type="text" placeholder="e.g. rocky-chrome"></label>
<label class="row"><input id="enabled" type="checkbox"> Enabled</label>
</fieldset>
<fieldset><legend>Source filters</legend>
<label>My Feishu name (for @me) <input id="myName" type="text"></label>
<label>Exclude chats (one per line, substring) <textarea id="excludeChats"></textarea></label>
<label>Only these chats (empty = all) <textarea id="includeOnlyChats"></textarea></label>
<label>Exclude senders <textarea id="excludeSenders"></textarea></label>
<label>Bot / assistant senders <textarea id="botSenders"></textarea></label>
<label>Bot messages <select id="botPolicy"><option value="mark">pass and mark</option><option value="pass">pass</option><option value="drop">drop</option></select></label>
<label>Muted chats <select id="mutedChats"><option value="followFeishu">follow Feishu (not pushed)</option><option value="all">push anyway</option><option value="none">also drop unread-count events</option></select></label>
<label>@me <select id="mentionMe"><option value="priority">priority</option><option value="normal">normal</option></select></label>
<label>@all <select id="mentionAll"><option value="normal">normal</option><option value="priority">priority</option><option value="ignore">ignore</option></select></label>
<div class="row"><label class="row"><input id="ct_dm" type="checkbox"> Direct messages</label><label class="row"><input id="ct_group" type="checkbox"> Group chats</label></div>
<div class="row">Ignore: <label class="row"><input id="it_recall" type="checkbox"> recalls</label><label class="row"><input id="it_reaction" type="checkbox"> reactions</label><label class="row"><input id="it_system" type="checkbox"> system notices</label></div>
<label class="row"><input id="titleFallback" type="checkbox"> Use tab-title unread count as fallback</label>
<label class="row"><input id="captureWhenOff" type="checkbox"> Capture even when Chrome notifications are off for Feishu</label>
<label>Chat currently open and focused <select id="focusedChatPolicy"><option value="push">push</option><option value="skip">do not push</option></select></label>
</fieldset>
<fieldset><legend>Content</legend>
<label>Priority keywords <textarea id="priorityKeywords"></textarea></label>
<label>Ignore keywords <textarea id="ignoreKeywords"></textarea></label>
<label class="row"><input id="useRegex" type="checkbox"> Keywords are regular expressions</label>
<label>Max body characters <input id="bodyMaxChars" type="number" min="50" max="1000"></label>
<label>Context messages <input id="contextCount" type="number" min="0" max="10"></label>
<label class="row"><input id="includeText" type="checkbox"> Include message text in pushes</label>
</fieldset>
<fieldset><legend>Timing</legend>
<label>Time zone <input id="timezone" type="text"></label>
<table id="hours"></table>
<label>Batch window (min) <input id="batchWindowMin" type="number" min="1" max="30"></label>
<label>Max events per push <input id="batchMax" type="number" min="1" max="20"></label>
<label>Dedupe window (min) <input id="dedupeWindowMin" type="number" min="1" max="60"></label>
<label>Queue limit (oldest dropped when full) <input id="queueMax" type="number" min="20" max="1000"></label>
<label>Debug log size <input id="debugLogSize" type="number" min="0" max="100"></label>
</fieldset>
<p><button id="save">Save</button> <button id="test">Send test push</button> <button id="export">Export</button> <button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden><span id="status"></span></p>
<p id="errors" class="err"></p>
<script type="module" src="options.js"></script>
</body></html>
